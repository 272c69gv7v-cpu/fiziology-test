 <label class="o"><input type="radio" name="b" value="c"> Только вопросы, где я исправил ответ (8)</label></div>
 <div class="c"><b>Сколько вопросов</b>
 <label class="o"><input type="radio" name="n" value="20"> 20</label>
 <label class="o"><input type="radio" name="n" value="50" checked> 50 (пробный экзамен)</label>
 <label class="o"><input type="radio" name="n" value="100"> 100</label>
 <label class="o"><input type="radio" name="n" value="0"> Все подряд</label></div>
 <button class="b" id="go">Начать</button>`;
 document.getElementById('go').onclick=()=>{
  const b=document.querySelector('[name=b]:checked').value,n=+document.querySelector('[name=n]:checked').value;
  let p=D.filter(x=>b==='all'||(b==='c'?x.f:x.b===b));p=sh(p);if(n)p=p.slice(0,n);start(p)};
}
function opts(x){
 const seen=new Set([x.a.toLowerCase()]),r=[];
 const add=u=>{const k=u.toLowerCase();if(!seen.has(k)&&r.length<4){seen.add(k);r.push(u)}};
 sh(x.w).slice(0,2).forEach(add);
 sh(x.d.slice(0,8)).forEach(add);
 if(r.length<4)sh(D.filter(y=>y.b===x.b)).slice(0,20).forEach(y=>add(y.a));
 return sh([x.a,...r]);
}
function start(p){Q=p;i=0;score=0;wrong=[];show()}
function show(){
 const x=Q[i];answered=false;const o=opts(x);
 app.innerHTML=`<div class="top"><span>Вопрос ${i+1} из ${Q.length}</span><span>Верно: ${score}</span></div>
 <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
 <div class="c"><div class="q"></div><div id="ops"></div><button class="b hid" id="nx" style="margin-top:14px"></button></div>
 <button class="b g" id="ex">Завершить</button>`;
 app.querySelector('.q').textContent=x.q;
 const ops=document.getElementById('ops');
 o.forEach(t=>{const bt=document.createElement('button');bt.className='o2';bt.textContent=t;bt.onclick=()=>pick(bt,t,x);ops.appendChild(bt)});
 document.getElementById('ex').onclick=()=>{Q=Q.slice(0,i+(answered?1:0));finish()};
}
function pick(bt,t,x){
 if(answered)return;answered=true;
 const ok=t===x.a;if(ok)score++;else wrong.push(x);
 if(x.f){const n=document.createElement('div');n.className='m';n.style.marginTop='12px';const b=document.createElement('b');b.textContent='Ответ в файле был неверным или неполным — исправил я';const sp=document.createElement('span');sp.style.color='var(--tx)';sp.textContent=x.n;n.append(b,sp);document.getElementById('ops').after(n)}
 [...document.querySelectorAll('.o2')].forEach(b=>{if(b.textContent===x.a)b.classList.add('ok');else if(b===bt)b.classList.add('no')});
 const nx=document.getElementById('nx');nx.classList.remove('hid');nx.textContent=i+1<Q.length?'Дальше':'Результат';
 nx.onclick=()=>{i++;i<Q.length?show():finish()};
}
function finish(){
 const n=Q.length,pc=n?Math.round(score/n*100):0;
 app.innerHTML=`<h1>Результат</h1><div class="big">${score} / ${n}</div><p class="s" style="text-align:center">${pc}% верных ответов</p><div id="wr"></div>
 ${wrong.length?'<button class="b" id="rt">Повторить ошибки</button>':''}<button class="b g" id="mn">В меню</button>`;
 const wr=document.getElementById('wr');
 if(wrong.length){const h=document.createElement('p');h.className='s';h.textContent='Разбор ошибок:';wr.appendChild(h)}
 wrong.forEach(x=>{const d=document.createElement('div');d.className='m';const b=document.createElement('b');b.textContent=x.q;const s=document.createElement('span');s.textContent=x.a;d.append(b,s);if(x.f){const nn=document.createElement('div');nn.style.cssText='color:var(--mu);font-size:14px';nn.textContent='Исправлено мной: '+x.n;d.append(nn)}wr.appendChild(d)});
 const rt=document.getElementById('rt');if(rt)rt.onclick=()=>start(sh(wrong));
 document.getElementById('mn').onclick=menu;
}
menu();
</script></body></html>
